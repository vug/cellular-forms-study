<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 414" width="920" height="414" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="920" height="414" fill="#fcfcfb"/>
<text x="20" y="28" font-size="17" font-weight="600" fill="#0b0b0b">CUDA backend: how many times faster than at the start of the night</text>
<text x="20" y="48" font-size="12.5" fill="#52514e">Same seeds, same results (identical checksums). RTX 4090. Bar = time before divided by time after.</text>
<line x1="300.0" y1="64" x2="300.0" y2="370" stroke="#e4e3df" stroke-width="1"/>
<text x="300.0" y="388" font-size="12" fill="#52514e" text-anchor="middle">0x</text>
<line x1="382.2" y1="64" x2="382.2" y2="370" stroke="#52514e" stroke-width="1" stroke-dasharray="3 3"/>
<text x="382.2" y="388" font-size="12" fill="#52514e" text-anchor="middle">1x</text>
<line x1="464.4" y1="64" x2="464.4" y2="370" stroke="#e4e3df" stroke-width="1"/>
<text x="464.4" y="388" font-size="12" fill="#52514e" text-anchor="middle">2x</text>
<line x1="546.7" y1="64" x2="546.7" y2="370" stroke="#e4e3df" stroke-width="1"/>
<text x="546.7" y="388" font-size="12" fill="#52514e" text-anchor="middle">3x</text>
<line x1="628.9" y1="64" x2="628.9" y2="370" stroke="#e4e3df" stroke-width="1"/>
<text x="628.9" y="388" font-size="12" fill="#52514e" text-anchor="middle">4x</text>
<text x="386.2" y="404" font-size="11.5" fill="#52514e">1x = no change</text>
<text x="290" y="86.0" font-size="13" fill="#0b0b0b" text-anchor="end">Grow to 100M cells, default food</text>
<path d="M300,74.0 h249.2 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-249.2 z" fill="#2a78d6"/>
<text x="561.2" y="86.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">3.1x</tspan><tspan fill="#52514e">  544 s to 177 s</tspan></text>
<text x="290" y="120.0" font-size="13" fill="#0b0b0b" text-anchor="end">Grow to 50M cells, default food</text>
<path d="M300,108.0 h249.4 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-249.4 z" fill="#2a78d6"/>
<text x="561.4" y="120.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">3.1x</tspan><tspan fill="#52514e">  210 s to 68.0 s</tspan></text>
<text x="290" y="154.0" font-size="13" fill="#0b0b0b" text-anchor="end">Grow to 10M cells, default food</text>
<path d="M300,142.0 h217.1 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-217.1 z" fill="#2a78d6"/>
<text x="529.1" y="154.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">2.7x</tspan><tspan fill="#52514e">  25.3 s to 9.41 s</tspan></text>
<text x="290" y="188.0" font-size="13" fill="#0b0b0b" text-anchor="end">Grow to 1M cells, default food</text>
<path d="M300,176.0 h157.4 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-157.4 z" fill="#2a78d6"/>
<text x="469.4" y="188.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">2.0x</tspan><tspan fill="#52514e">  3.18 s to 1.62 s</tspan></text>
<text x="290" y="222.0" font-size="13" fill="#0b0b0b" text-anchor="end">Grow to 10M cells, crowding limit</text>
<path d="M300,210.0 h245.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-245.0 z" fill="#2a78d6"/>
<text x="557.0" y="222.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">3.0x</tspan><tspan fill="#52514e">  64.5 s to 21.3 s</tspan></text>
<text x="290" y="256.0" font-size="13" fill="#0b0b0b" text-anchor="end">Grow to 1M cells, crowding limit</text>
<path d="M300,244.0 h157.7 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-157.7 z" fill="#2a78d6"/>
<text x="469.7" y="256.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">2.0x</tspan><tspan fill="#52514e">  3.54 s to 1.80 s</tspan></text>
<text x="290" y="290.0" font-size="13" fill="#0b0b0b" text-anchor="end">One step at 40M cells, default food</text>
<path d="M300,278.0 h223.9 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-223.9 z" fill="#2a78d6"/>
<text x="535.9" y="290.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">2.8x</tspan><tspan fill="#52514e">  291 ms to 105 ms</tspan></text>
<text x="290" y="324.0" font-size="13" fill="#0b0b0b" text-anchor="end">One step at 10M cells, default food</text>
<path d="M300,312.0 h213.3 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-213.3 z" fill="#2a78d6"/>
<text x="525.3" y="324.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">2.6x</tspan><tspan fill="#52514e">  40.7 ms to 15.4 ms</tspan></text>
<text x="290" y="358.0" font-size="13" fill="#0b0b0b" text-anchor="end">One step at 10M cells, crowding limit</text>
<path d="M300,346.0 h338.3 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-338.3 z" fill="#2a78d6"/>
<text x="650.3" y="358.0" font-size="13" fill="#0b0b0b"><tspan font-weight="600">4.2x</tspan><tspan fill="#52514e">  35.8 ms to 8.60 ms</tspan></text>
</svg>
