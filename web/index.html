<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cf-webgpu</title>
<style>
  :root { color-scheme: dark; --bg: #16181d; --panel: #1f232b; --text: #e6e3dc; --muted: #9aa0a8; --accent: #e0b060; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; }
  canvas { width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 6px; display: block; }
  aside { background: var(--panel); border-radius: 6px; padding: 12px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  label { display: grid; grid-template-columns: 130px 1fr 52px; gap: 6px; align-items: center; margin: 4px 0; color: var(--muted); }
  button { background: #2c323d; color: var(--text); border: 1px solid #3a4250; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
  #status { color: var(--accent); margin: 8px 0; min-height: 1.4em; font-variant-numeric: tabular-nums; }
  pre { grid-column: 1 / -1; background: var(--panel); border-radius: 6px; padding: 12px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <canvas id="view" width="1200" height="900"></canvas>
  <aside>
    <h1>Cellular Forms: WebGPU port</h1>
    <div id="status">starting</div>
    <p><button id="run">Pause</button> <button id="reset">Reset</button>
       <label style="display:inline; margin-left:8px"><input type="checkbox" id="age" checked> colour by age</label></p>
    <label>spring <input type="range" id="springFactor" min="0" max="0.6" step="0.01"><span id="springFactorValue"></span></label>
    <label>planar <input type="range" id="planarFactor" min="0" max="0.6" step="0.01"><span id="planarFactorValue"></span></label>
    <label>bulge <input type="range" id="bulgeFactor" min="0" max="0.6" step="0.01"><span id="bulgeFactorValue"></span></label>
    <label>repulsion <input type="range" id="repulsionStrength" min="0" max="1" step="0.01"><span id="repulsionStrengthValue"></span></label>
    <label>influence radius <input type="range" id="radiusOfInfluence" min="0.3" max="4" step="0.05"><span id="radiusOfInfluenceValue"></span></label>
    <label>food per step <input type="range" id="foodMax" min="0" max="0.02" step="0.0005"><span id="foodMaxValue"></span></label>
    <p style="color:var(--muted)">Scripted runs: <code>?task=verify</code>, <code>?task=rerun&amp;cells=200000</code>,
      <code>?task=bench&amp;cells=1000000</code>. They read CPU checkpoints from <code>/runs/web_verify</code>
      (made by <code>scripts/web_verify_data.ps1</code>).</p>
  </aside>
  <pre id="log"></pre>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
