<title>Form Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: a specimen catalogue. One sticky bar of views, one filter row shared by gallery, map and
   table, then the working surface; the record of a run slides in over whatever is open. */
:root {
  --bg: #f1f2f5; --surface: #fbfbfc; --well: #e7e9ee; --ink: #161920; --ink-2: #464d5b; --muted: #636b7a;
  --line: #d9dce3; --line-2: #bcc2cc; --accent: #2c4c9c; --accent-soft: #e1e7f6; --on-accent: #ffffff;
  --star: #b97700; --plate: #5a5f6b; --plate-ink: #eceef2; --plate-shade: rgba(15, 17, 21, 0.7);
  --scrim: rgba(20, 23, 30, 0.5); --shadow: 0 8px 30px rgba(20, 23, 30, 0.18);
  /* marks: categorical slots, ordinal and sequential blue, diverging poles, run status */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --other: #8a909c;
  --o1: #86b6ef; --o2: #5598e7; --o3: #2a78d6; --o4: #1c5cab; --o5: #104281; --o1-ink: #0b0b0b; --o3-ink: #ffffff; --o5-ink: #ffffff;
  --q0: #9ec5f4; --q1: #5598e7; --q2: #2a78d6; --q3: #1c5cab; --q4: #0d366b;
  --pos: #2a78d6; --neg: #e34948; --grid: #e4e6eb; --axis: #bcc2cc;
  --st-ok: #7d8492; --st-stalled: #eda100; --st-broken: #d03b3b;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #181b21; --well: #23272f; --ink: #eceef2; --ink-2: #b8bfca; --muted: #8d95a3;
    --line: #2a2f38; --line-2: #3d434e; --accent: #9db5f0; --accent-soft: #232c44; --on-accent: #10141f;
    --star: #e0a526; --plate: #5a5f6b; --plate-ink: #eceef2; --plate-shade: rgba(15, 17, 21, 0.7);
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --other: #7b8290;
    --o1: #184f95; --o2: #256abf; --o3: #3987e5; --o4: #6da7ec; --o5: #9ec5f4; --o1-ink: #ffffff; --o3-ink: #ffffff; --o5-ink: #0b0b0b;
    --q0: #184f95; --q1: #256abf; --q2: #3987e5; --q3: #6da7ec; --q4: #cde2fb;
    --pos: #3987e5; --neg: #e66767; --grid: #262a33; --axis: #3d434e;
    --st-ok: #8d95a3; --st-stalled: #c98500; --st-broken: #d03b3b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #181b21; --well: #23272f; --ink: #eceef2; --ink-2: #b8bfca; --muted: #8d95a3;
  --line: #2a2f38; --line-2: #3d434e; --accent: #9db5f0; --accent-soft: #232c44; --on-accent: #10141f;
  --star: #e0a526; --plate: #5a5f6b; --plate-ink: #eceef2; --plate-shade: rgba(15, 17, 21, 0.7);
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --other: #7b8290;
  --o1: #184f95; --o2: #256abf; --o3: #3987e5; --o4: #6da7ec; --o5: #9ec5f4; --o1-ink: #ffffff; --o3-ink: #ffffff; --o5-ink: #0b0b0b;
  --q0: #184f95; --q1: #256abf; --q2: #3987e5; --q3: #6da7ec; --q4: #cde2fb;
  --pos: #3987e5; --neg: #e66767; --grid: #262a33; --axis: #3d434e;
  --st-ok: #8d95a3; --st-stalled: #c98500; --st-broken: #d03b3b;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
html.locked, html.locked body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p, dl, dd, figure { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1480px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.empty { color: var(--ink-2); padding: 28px 0; max-width: 60ch; }

/* controls */
.btn { appearance: none; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 10px; min-height: 32px; cursor: pointer; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--well); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--well); }
.btn:disabled { opacity: 0.45; cursor: default; }
.inp { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 5px 8px; min-height: 32px; min-width: 0; }
select.inp { padding-right: 4px; max-width: 100%; }
label.lab { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); min-width: 0; }
label.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--st-ok); flex: none; }
.pill.st-stoppedearly i { background: var(--s1); border-radius: 1px; }
.pill.st-stalled i { background: var(--st-stalled); }
.pill.st-broken i { background: var(--st-broken); }
@media (max-width: 759px) { input, select, textarea { font-size: 16px; } }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 0 18px; padding-top: 6px; }
.brand { font: 600 17px/1 var(--cond); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink); text-decoration: none; padding: 8px 0; }
.tabs { display: flex; gap: 2px; order: 3; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 8px 11px 9px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; color: var(--ink-2); }
#meta { white-space: nowrap; }
.save { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.save i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
.save.ok i { background: var(--s3); }
.save.busy i { background: var(--s4); }
.save.err i { background: var(--st-broken); }
.save.err { color: var(--ink); }
@media (min-width: 900px) { .tabs { order: 0; flex-basis: auto; } .bar-in { padding-top: 0; } }
@media (max-width: 619px) { #meta { display: none; } }

/* filters */
.filters { padding-block: 12px 2px; display: grid; gap: 8px; }
.f-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#f-q { flex: 1 1 200px; max-width: 420px; }
.f-count { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.f-count b { color: var(--ink); font-weight: 600; }
.f-more { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chips .cl { color: var(--muted); font-size: 12.5px; margin-right: 2px; }
.chip { appearance: none; border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 3px 10px; min-height: 28px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.f-metric { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }
.f-metric input { width: 96px; }
@media (max-width: 759px) {
  .f-more { display: grid; grid-template-columns: 1fr 1fr; }
  .f-more:not(.open) { display: none; }
  .f-more > select { width: 100%; }
  .f-more .chips, .f-more .f-metric { grid-column: 1 / -1; }
  .f-metric select { flex: 1 1 100%; }
  .f-metric input { flex: 1 1 80px; width: auto; }
}
@media (min-width: 760px) { #f-toggle { display: none; } }

main { padding-block: 4px 48px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 8px 10px; }
.tools .right { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 12.5px; max-width: 80ch; }

/* pictures */
.thumb { display: block; position: relative; aspect-ratio: 4 / 3; width: 100%; max-width: 100%; background-color: var(--plate); background-repeat: no-repeat; border-radius: 4px; color: var(--plate-ink); }
.thumb.none { display: grid; place-items: center; font-size: 11px; line-height: 1.2; text-align: center; padding: 4px; }
.flag { position: absolute; left: 4px; top: 4px; font: 500 10.5px/1 var(--cond); letter-spacing: 0.05em; text-transform: uppercase; background: var(--plate-shade); color: var(--plate-ink); padding: 3px 5px; border-radius: 3px; }

/* gallery */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px 10px; }
.card { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: grid; gap: 4px; min-width: 0; color: inherit; align-content: start; }
.card:hover .thumb, .card:focus-visible .thumb { outline: 2px solid var(--accent); outline-offset: 1px; }
.card:focus-visible { outline: none; }
.cap { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.id { font: 500 13px var(--mono); }
.stars { color: var(--star); font-size: 12px; letter-spacing: 1px; white-space: nowrap; }
.val { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.val .vv { color: var(--ink-2); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.more { display: flex; justify-content: center; padding: 18px 0 0; }

/* map */
.plot { position: relative; height: clamp(300px, min(66vh, 105vw), 700px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; touch-action: manipulation; }
.plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pcard { position: absolute; z-index: 2; width: 236px; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; padding: 8px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); pointer-events: none; font-size: 12px; line-height: 1.35; }
.pcard.pinned { pointer-events: auto; }
.pcard .t { font: 600 13px var(--mono); }
.pcard .kv { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); }
.pcard .kv b { color: var(--ink); font-weight: 500; font-family: var(--mono); }
.pcard .btn { grid-column: 1 / -1; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 4px; padding-block: 8px 2px; align-items: center; font-size: 13px; color: var(--ink-2); }
.legend .lt { color: var(--muted); margin-right: 4px; }
.lg { appearance: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none; border-radius: 6px; padding: 3px 8px; min-height: 28px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.lg:hover { background: var(--well); }
.lg[aria-pressed="true"] { border-color: var(--line-2); background: var(--well); color: var(--ink); }
.lg .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.lg svg, .key svg { flex: none; }
.ramp { height: 10px; width: 160px; max-width: 40vw; border-radius: 3px; background: linear-gradient(90deg, var(--q0), var(--q1), var(--q2), var(--q3), var(--q4)); margin: 0 6px; }

/* table */
.t-scroll { overflow: auto; max-height: 76vh; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.db { border-collapse: separate; border-spacing: 0; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.db th, .db td { padding: 5px 9px; border-bottom: 1px solid var(--line); text-align: left; background: var(--surface); }
.db td.num, .db th.num { text-align: right; }
.db td.num { font-family: var(--mono); }
.db thead th { position: sticky; z-index: 2; font: 600 12px/1.2 var(--cond); letter-spacing: 0.03em; color: var(--ink-2); }
.db thead tr.grp th { top: 0; height: 24px; padding-block: 0; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.08em; color: var(--muted); border-bottom: 0; }
.db thead tr.col th { top: 24px; padding: 0; border-bottom: 1px solid var(--line-2); }
.db thead th button { appearance: none; border: 0; background: none; font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; padding: 6px 9px; width: 100%; text-align: inherit; white-space: nowrap; }
.db thead th button:hover { color: var(--ink); }
.db thead th[aria-sort] button { color: var(--ink); }
.db th.c-id, .db td.c-id { position: sticky; left: 0; z-index: 1; border-right: 1px solid var(--line); }
.db thead th.c-id { z-index: 3; }
.db tbody tr { cursor: pointer; }
.db tbody tr:hover td { background: var(--well); }
.db tbody tr:focus-visible { outline-offset: -2px; }
details.pick { position: relative; }
details.pick > summary { cursor: pointer; list-style: none; }
details.pick > summary::-webkit-details-marker { display: none; }
.pick-list { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; width: min(520px, calc(100vw - 32px)); max-height: 50vh; overflow: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; }
.pick-list label { display: flex; gap: 6px; align-items: center; font: 12.5px var(--mono); cursor: pointer; }

/* kinds */
.kinds { display: grid; gap: 14px; }
.kind { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 16px; display: grid; gap: 12px; }
.kind-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.kind-name { font-weight: 600; font-size: 16px; flex: 1 1 220px; max-width: 360px; }
.kind-head .work { color: var(--ink-2); }
.kind-head .cnt { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.kind-head .sv { font-size: 12.5px; color: var(--muted); }
.kind-body { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
.kind-body .typ { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 4px; text-align: left; color: var(--muted); font-size: 12.5px; }
.kind-side { display: grid; gap: 12px; min-width: 0; }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; max-width: 760px; }
.strip button { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; display: grid; gap: 2px; font: 11px var(--mono); color: var(--muted); text-align: left; }
.strip button:hover .thumb, .typ:hover .thumb { outline: 2px solid var(--accent); outline-offset: 1px; }
h4.sub { font: 600 11px/1.2 var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.apart { display: grid; gap: 4px; }
.frow { display: grid; grid-template-columns: minmax(110px, 190px) 120px 52px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; }
.frow .fa { color: var(--muted); font-size: 12.5px; }
.frow .fv { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.dv { position: relative; height: 8px; background: var(--well); border-radius: 2px; }
.dv::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.dv i { position: absolute; top: 0; bottom: 0; background: var(--pos); border-radius: 0 3px 3px 0; left: 50%; }
.dv i.neg { background: var(--neg); border-radius: 3px 0 0 3px; left: auto; right: 50%; }
@media (max-width: 759px) {
  .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kind-body { grid-template-columns: 1fr; }
  .frow { grid-template-columns: minmax(0, 1fr) 90px 52px; }
  .frow .fa { grid-column: 1 / -1; margin-top: -4px; }
}

/* early stop */
.stop { display: grid; gap: 22px; }
.stop p.lead { max-width: 76ch; color: var(--ink-2); }
.stop h3, .sec h3 { font: 600 12px/1.2 var(--cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.tile .v { font-weight: 600; font-size: 28px; line-height: 1.15; }
.tile .l { color: var(--ink-2); }
.tile .s { color: var(--muted); font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.segs { display: grid; gap: 10px; }
.segrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: center; }
.seg { display: flex; gap: 2px; height: 28px; }
.sg { border-radius: 4px; min-width: 3px; display: flex; align-items: center; padding-left: 7px; font-size: 12px; font-variant-numeric: tabular-nums; }
.sg.a { background: var(--o1); color: var(--o1-ink); } .sg.b { background: var(--o3); color: var(--o3-ink); } .sg.c { background: var(--o5); color: var(--o5-ink); } .sg.d { background: var(--well); color: var(--ink-2); }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.key i.ln { height: 2px; border-radius: 1px; width: 16px; }
.scroll-x { overflow-x: auto; }
table.plain { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.plain th, .plain td { padding: 5px 12px 5px 0; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.plain th { font: 600 12px var(--cond); letter-spacing: 0.03em; color: var(--ink-2); }
.plain td.num, .plain th.num { text-align: right; font-family: var(--mono); }
.plain th.num { font-family: var(--cond); }
.wcell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.wcell .dv { width: 84px; flex: none; }
.wcell span { width: 46px; text-align: right; font-family: var(--mono); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 10px; }
.picks .card { font-size: 12px; color: var(--muted); }
.picks.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 759px) { .picks.six { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cmd span { white-space: nowrap; }
@media (max-width: 559px) { .segrow { grid-template-columns: 1fr; gap: 4px; } }

/* run record */
.detail { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(880px, 100%); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; outline: none; }
.d-head { flex: none; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }

  $("#db tbody").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset.run) openRun(Number(e.target.dataset.run)); });
  $("#t-prev").addEventListener("click", () => { S.table.page--; renderTable(true); $("#t-scroll").scrollTop = 0; });
  $("#t-next").addEventListener("click", () => { S.table.page++; renderTable(true); $("#t-scroll").scrollTop = 0; });
  $("#t-pick-list").addEventListener("change", () => {
    S.table.cols = [...document.querySelectorAll("#t-pick-list input:checked")].map((i) => i.value);
    saveUi();
    renderTable(true);
  });
  document.addEventListener("click", (e) => { const p = $("#t-pick"); if (p.open && !p.contains(e.target)) p.open = false; });
  // kinds: names
  $("#kinds").addEventListener("input", (e) => { const i = e.target.closest(".kind-name"); if (i) { markKind(i); editKind(Number(i.dataset.kind), i.value, 900); } });
  $("#kinds").addEventListener("change", (e) => { const i = e.target.closest(".kind-name"); if (i) { markKind(i); editKind(Number(i.dataset.kind), i.value.trim(), 0); } });
  $("#kinds").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.closest(".kind-name")) e.target.blur(); });
  // record
  $("#scrim").addEventListener("click", closeDetail);
  document.addEventListener("keydown", (e) => {
    if (S.detail == null || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Escape") { closeDetail(); return; }
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (e.key === "ArrowLeft" && S.dPrev != null) openRun(S.dPrev);
    else if (e.key === "ArrowRight" && S.dNext != null) openRun(S.dNext);
    else if (/^[0-5]$/.test(e.key) && S.byId.has(S.detail)) editLabel(S.detail, {rating: Number(e.key)}, 0);
  });
  window.addEventListener("resize", debounce(() => { if (S.detail != null && D) drawCharts(); }, 160));
  // the canvas takes its colours from the theme
  const themed = () => { if (D && S.view === "map") drawMap(); };
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themed); } catch (e) { /* older browsers */ }
  new MutationObserver(themed).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
}
function markKind(input) { const e = $('.kind .sv[data-kind="' + input.dataset.kind + '"]'); if (e) e.dataset.touched = "1"; }

// ---------------------------------------------------------------- start
loadUi();
bind();
applyRoute(location.hash);
showView();
updateSaveUi();
connectStore();
load(false);
})();
</script>
